<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - SnapBuy Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2><a href="../index.html" style="text-decoration: none; color: #007bff;">SnapBuy Admin</a></h2>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link active">Products</a>
                <a href="orders.html" class="nav-link">Orders</a>
                <a href="../index.html" class="nav-link">View Store</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Manage Products</h1>
            <button class="btn-primary" onclick="showAddProductForm()">Add New Product</button>
        </div>

        <!-- Add Product Form -->
        <div id="addProductForm" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeAddProductForm()">&times;</span>
                <h2>Add New Product</h2>
                <form id="newProductForm">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice">Price (₹)</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label for="productStock">Stock Quantity</label>
                            <input type="number" id="productStock" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category</label>
                        <select id="productCategory" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Fashion">Fashion</option>
                            <option value="Home">Home</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Product</button>
                </form>
            </div>
        </div>

        <!-- Products List -->
        <div class="products-list">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 1rem; text-align: left;">Product</th>
                        <th style="padding: 1rem; text-align: left;">Price</th>
                        <th style="padding: 1rem; text-align: left;">Stock</th>
                        <th style="padding: 1rem; text-align: left;">Category</th>
                        <th style="padding: 1rem; text-align: left;">Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTable">
                    <!-- Products will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sample products data
        const products = [
            { id: 1, name: "Wireless Headphones", price: 2999, stock: 50, category: "Electronics" },
            { id: 2, name: "Smart Watch", price: 4999, stock: 30, category: "Electronics" },
            { id: 3, name: "Running Shoes", price: 3499, stock: 25, category: "Fashion" }
        ];

        function loadProducts() {
            const table = document.getElementById('productsTable');
            table.innerHTML = products.map(product => `
                <tr>
                    <td style="padding: 1rem; border-bottom: 1px solid #e9ecef;">${product.name}</td>
                    <td style="padding: 1rem; border-bottom: 1px solid #e9ecef;">₹${product.price}</td>
                    <td style="padding: 1rem; border-bottom: 1px solid #e9ecef;">${product.stock}</td>
                    <td style="padding: 1rem; border-bottom: 1px solid #e9ecef;">${product.category}</td>
                    <td style="padding: 1rem; border-bottom: 1px solid #e9ecef;">
                        <button class="btn-outline" onclick="editProduct(${product.id})">Edit</button>
                        <button class="btn-outline" style="background: #dc3545; color: white;" onclick="deleteProduct(${product.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function showAddProductForm() {
            document.getElementById('addProductForm').style.display = 'block';
        }

        function closeAddProductForm() {
            document.getElementById('addProductForm').style.display = 'none';
        }

        function editProduct(id) {
            alert(`Edit product ${id} - This would open an edit form in a real application`);
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                alert(`Product ${id} deleted - This would remove from database in real application`);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>

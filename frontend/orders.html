<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - SnapBuy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2><a href="index.html">SnapBuy</a></h2>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="orders.html" class="nav-link active">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>My Orders</h1>
        
        <div class="orders-container">
            <div class="orders-list" id="ordersList">
                <!-- Orders loaded by JavaScript -->
                <div class="no-orders" id="noOrders">
                    <p>You haven't placed any orders yet</p>
                    <a href="products.html" class="btn-primary">Start Shopping</a>
                </div>
            </div>

            <!-- Order Tracking Modal -->
            <div id="trackingModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Order Tracking</h2>
                    <div id="trackingDetails">
                        <!-- Tracking details loaded by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/orders.js"></script>
</body>
</html>
